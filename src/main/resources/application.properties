# Executable jar with embedded Tomcat runs on :8080.
server.port=8080

# H2 in-memory database. Override with JVM properties, e.g.:
# -Dspring.datasource.url=jdbc:h2:file:/data/blogdb
spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Run schema.sql + data.sql from the classpath on every start.
spring.sql.init.mode=always

# Upload limits (mirror PostServiceImpl.MAX_IMAGE_SIZE = 5 MB).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=1MB
