# Isolated test database. schema.sql is the single main copy;
# data is replaced with an empty script so no demo rows leak into tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# data.sql lives only in main resources; tests use an empty script instead.
# NOTE: default locations execute EVERY classpath match, so an explicit
# location is required — a same-named test data.sql would NOT shadow main's.
spring.sql.init.data-locations=classpath:test-data.sql
